<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крестики-персики 🍑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  @keyframes acid-bg {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes rainbow-text {
    0%   { color: #ff0000; text-shadow: 3px 3px 0 #00ff00, -3px -3px 0 #0000ff; }
    25%  { color: #ffff00; text-shadow: 3px 3px 0 #ff00ff, -3px -3px 0 #00ffff; }
    50%  { color: #00ff00; text-shadow: 3px 3px 0 #ff0000, -3px -3px 0 #ffff00; }
    75%  { color: #00ffff; text-shadow: 3px 3px 0 #0000ff, -3px -3px 0 #ff00ff; }
    100% { color: #ff0000; text-shadow: 3px 3px 0 #00ff00, -3px -3px 0 #0000ff; }
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.25; }
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-4deg) scale(1); }
    50% { transform: rotate(4deg) scale(1.08); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes win-flash {
    0%, 100% { background: #ff0000; border-color: #ffff00; transform: scale(1); }
    25% { background: #ffff00; border-color: #ff00ff; transform: scale(1.1) rotate(5deg); }
    50% { background: #00ff00; border-color: #ff0000; transform: scale(1); }
    75% { background: #ff00ff; border-color: #00ffff; transform: scale(1.1) rotate(-5deg); }
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(720deg); }
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) rotate(1080deg) scale(0.3); opacity: 0; }
  }
  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @keyframes heart-pulse {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(1.5); }
    50% { transform: scale(1.1); }
    70% { transform: scale(1.4); }
  }
  @keyframes pulse-border {
    0%, 100% { border-color: #ff00ff; box-shadow: 0 0 20px #ff00ff; }
    50% { border-color: #00ffff; box-shadow: 0 0 40px #00ff00; }
  }

  body {
    background: linear-gradient(124deg, #ff2400, #e8ff00, #00ff2f, #00fff7, #2400ff, #ff00e6, #ff2400);
    background-size: 800% 800%;
    animation: acid-bg 6s ease infinite;
    color: #fff;
    font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 42px 16px;
    overflow-x: hidden;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text y="26" font-size="26">🍑</text></svg>') 16 16, auto;
  }

  .peach-fall {
    position: fixed;
    top: -70px;
    z-index: 0;
    animation: fall linear forwards;
    pointer-events: none;
  }

  .peach-burst {
    position: fixed;
    z-index: 20;
    animation: burst 1.2s ease-out forwards;
    pointer-events: none;
    font-size: 2rem;
  }

  .marquee {
    position: fixed;
    left: 0;
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    font-size: 1.6rem;
    z-index: 5;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.35);
  }
  .marquee.top { top: 0; }
  .marquee.bottom { bottom: 0; }
  .marquee span {
    display: inline-block;
    animation: marquee 9s linear infinite;
  }
  .marquee.bottom span { animation-direction: reverse; }

  .app {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: rgba(0, 0, 0, 0.45);
    border: 5px dashed #ff00ff;
    border-radius: 20px;
    padding: 18px;
    animation: pulse-border 2s linear infinite;
  }

  .love {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 900;
    color: #ff2d78;
    text-shadow: 2px 2px 0 #ffff00, -2px -2px 0 #00ffff;
  }
  .love .heart {
    display: inline-block;
    animation: heart-pulse 1.1s ease-in-out infinite;
    filter: drop-shadow(0 0 8px #ff0055);
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 900;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    animation: rainbow-text 2s linear infinite;
  }
  h1 .spin { display: inline-block; animation: spin 2s linear infinite; }

  .modes {
    display: flex;
    background: repeating-linear-gradient(45deg, #ff8800 0 10px, #ff00aa 10px 20px);
    border-radius: 12px;
    padding: 5px;
    gap: 5px;
    border: 3px solid #00ff00;
  }

  .modes button {
    flex: 1;
    padding: 10px 8px;
    border: 3px dotted #ffff00;
    border-radius: 9px;
    background: #6600cc;
    color: #00ffcc;
    font-size: 0.9rem;
    font-family: inherit;
    font-weight: 700;
    cursor: inherit;
    text-shadow: 1px 1px 0 #ff0000;
  }

  .modes button.active {
    background: #ff0066;
    color: #ffff00;
    border-style: solid;
    border-color: #00ffff;
    animation: blink 1s steps(1) infinite;
  }

  .score {
    display: flex;
    justify-content: space-between;
    background: repeating-linear-gradient(-45deg, #00cc44 0 12px, #0044cc 12px 24px);
    border: 4px ridge #ff9900;
    border-radius: 12px;
    padding: 10px 12px;
  }

  .score .item { text-align: center; flex: 1; }

  .score .label {
    font-size: 0.72rem;
    color: #ffff00;
    text-shadow: 1px 1px 0 #ff0000;
    margin-bottom: 2px;
  }

  .score .value {
    font-size: 1.4rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }

  .score .x .value { color: #00ffff; text-shadow: 2px 2px 0 #ff0000; }
  .score .o .value { color: #ff88ff; text-shadow: 2px 2px 0 #0000ff; }
  .score .item:nth-child(2) .value { color: #aaff00; text-shadow: 2px 2px 0 #aa00ff; }

  .status {
    text-align: center;
    font-size: 1.05rem;
    font-weight: 700;
    min-height: 1.5em;
    color: #ffff00;
    text-shadow: 2px 2px 0 #ff00ff, -2px -2px 0 #00ffff;
    animation: blink 1.4s steps(1) infinite;
  }

  .status .x { color: #00ffff; }
  .status .o { color: #ffbb88; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    aspect-ratio: 1;
  }

  .cell {
    background: #39ff14;
    border: 4px dashed #ff1493;
    border-radius: 14px;
    font-size: clamp(2rem, 12vw, 3.2rem);
    font-weight: 900;
    font-family: inherit;
    color: #fff;
    cursor: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    text-shadow: 3px 3px 0 #0000ff;
  }
  .cell:nth-child(odd) { transform: rotate(-3deg); background: #ff6ec7; border-color: #39ff14; }
  .cell:nth-child(3n) { background: #00e5ff; border-color: #ff8800; }

  .cell:not(:disabled):hover { animation: wobble 0.4s ease infinite; }
  .cell:disabled { cursor: inherit; }

  .cell.x { color: #0033ff; text-shadow: 3px 3px 0 #ffff00, -2px -2px 0 #ff0000; }
  .cell.o { text-shadow: none; }

  .cell.win {
    animation: win-flash 0.7s linear infinite;
  }

  .restart {
    padding: 14px;
    border: 4px double #00ff00;
    border-radius: 12px;
    background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);
    background-size: 300% 100%;
    animation: acid-bg 3s linear infinite;
    color: #fff;
    font-size: 1.05rem;
    font-family: inherit;
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 2px 2px 0 #000;
    cursor: inherit;
  }

  .restart:hover { letter-spacing: 0.2em; }

  .nav {
    text-align: center;
    font-size: 0.85rem;
  }
  .nav a {
    color: #00ffcc;
    text-shadow: 1px 1px 0 #ff0000;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="marquee top"><span id="marquee-top"></span></div>
<div class="marquee bottom"><span id="marquee-bottom"></span></div>

<div class="app">
  <div class="love">Я люблю Арину <span class="heart">❤️</span></div>

  <h1><span class="spin">🍑</span> Крестики-персики <span class="spin">🍑</span></h1>

  <div class="modes" role="group" aria-label="Режим игры">
    <button id="mode-pvp" class="active">Два игрока</button>
    <button id="mode-cpu">Против компьютера</button>
  </div>

  <div class="score">
    <div class="item x">
      <div class="label" id="label-x">Игрок ✖</div>
      <div class="value" id="score-x">0</div>
    </div>
    <div class="item">
      <div class="label">Ничьи</div>
      <div class="value" id="score-draw">0</div>
    </div>
    <div class="item o">
      <div class="label" id="label-o">Игрок 🍑</div>
      <div class="value" id="score-o">0</div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="board" id="board"></div>

  <button class="restart" id="restart">🍑 Заново 🍑</button>

  <div class="nav"><a href="bubbles.html">🫧 Лопни персик по счёту 🍑</a></div>
</div>

<script>
(function () {
  const LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  // Как фигуры выводятся на поле и в текстах
  const MARK = { X: '✖', O: '🍑' };

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const scoreXEl = document.getElementById('score-x');
  const scoreOEl = document.getElementById('score-o');
  const scoreDrawEl = document.getElementById('score-draw');
  const labelXEl = document.getElementById('label-x');
  const labelOEl = document.getElementById('label-o');
  const modePvpBtn = document.getElementById('mode-pvp');
  const modeCpuBtn = document.getElementById('mode-cpu');

  let board, current, gameOver, vsCpu = false;
  let score = { X: 0, O: 0, draw: 0 };
  let cpuTimer = null;

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('button');
    cell.className = 'cell';
    cell.addEventListener('click', () => onCellClick(i));
    boardEl.appendChild(cell);
    cells.push(cell);
  }

  function reset() {
    clearTimeout(cpuTimer);
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    cells.forEach(c => {
      c.textContent = '';
      c.disabled = false;
      c.classList.remove('x', 'o', 'win');
    });
    updateStatus();
  }

  function setMode(cpu) {
    vsCpu = cpu;
    modePvpBtn.classList.toggle('active', !cpu);
    modeCpuBtn.classList.toggle('active', cpu);
    labelXEl.textContent = cpu ? 'Вы (✖)' : 'Игрок ✖';
    labelOEl.textContent = cpu ? 'Компьютер (🍑)' : 'Игрок 🍑';
    score = { X: 0, O: 0, draw: 0 };
    renderScore();
    reset();
  }

  function onCellClick(i) {
    if (gameOver || board[i]) return;
    if (vsCpu && current === 'O') return; // ход компьютера
    makeMove(i);
    if (!gameOver && vsCpu && current === 'O') {
      cpuTimer = setTimeout(cpuMove, 400);
    }
  }

  function makeMove(i) {
    board[i] = current;
    cells[i].textContent = MARK[current];
    cells[i].classList.add(current.toLowerCase());
    cells[i].disabled = true;

    const winLine = findWin(board, current);
    if (winLine) {
      gameOver = true;
      winLine.forEach(idx => cells[idx].classList.add('win'));
      cells.forEach(c => c.disabled = true);
      score[current]++;
      renderScore();
      statusEl.innerHTML = winnerText(current);
      peachExplosion();
      return;
    }

    if (board.every(Boolean)) {
      gameOver = true;
      score.draw++;
      renderScore();
      statusEl.textContent = 'Ничья 🍑🤝🍑';
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    updateStatus();
  }

  function findWin(b, player) {
    return LINES.find(line => line.every(i => b[i] === player)) || null;
  }

  // Компьютер играет разумно, но не идеально:
  // выигрывает и блокирует, дальше — эвристика с элементом случайности.
  function cpuMove() {
    if (gameOver) return;
    const free = board.map((v, i) => v === null ? i : -1).filter(i => i >= 0);
    if (!free.length) return;

    let move = findLineMove('O') // выиграть, если можно
            ?? findLineMove('X'); // заблокировать игрока

    if (move === null) {
      // Иногда ходит наугад — чтобы его можно было обыграть
      if (Math.random() < 0.25) {
        move = free[Math.floor(Math.random() * free.length)];
      } else if (board[4] === null) {
        move = 4;
      } else {
        const corners = [0, 2, 6, 8].filter(i => board[i] === null);
        const pool = corners.length ? corners : free;
        move = pool[Math.floor(Math.random() * pool.length)];
      }
    }

    makeMove(move);
  }

  function findLineMove(player) {
    for (const line of LINES) {
      const marks = line.map(i => board[i]);
      if (marks.filter(m => m === player).length === 2 && marks.includes(null)) {
        return line[marks.indexOf(null)];
      }
    }
    return null;
  }

  function updateStatus() {
    if (vsCpu) {
      statusEl.innerHTML = current === 'X'
        ? 'Ваш ход — <span class="x">✖</span>'
        : 'Компьютер выбирает персик… 🍑';
    } else {
      statusEl.innerHTML = `Ход: <span class="${current.toLowerCase()}">${MARK[current]}</span>`;
    }
  }

  function winnerText(player) {
    if (vsCpu) {
      return player === 'X' ? 'Вы победили! 🎉🍑🎉' : 'Победил компьютер 🍑👑';
    }
    return `Победил <span class="${player.toLowerCase()}">${MARK[player]}</span>! 🍑🍑🍑`;
  }

  function renderScore() {
    scoreXEl.textContent = score.X;
    scoreOEl.textContent = score.O;
    scoreDrawEl.textContent = score.draw;
  }

  // ---------- ПЕРСИКИ ----------

  // Бесконечный персиковый дождь
  setInterval(() => {
    if (document.hidden) return;
    const p = document.createElement('div');
    p.className = 'peach-fall';
    p.textContent = '🍑';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (14 + Math.random() * 42) + 'px';
    p.style.animationDuration = (4 + Math.random() * 7) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 12000);
  }, 350);

  // Взрыв персиков при победе
  function peachExplosion() {
    const rect = boardEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'peach-burst';
      p.textContent = '🍑';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      const angle = Math.random() * Math.PI * 2;
      const dist = 120 + Math.random() * 260;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1600);
    }
  }

  // Бегущие строки из персиков
  const strip = ' 🍑 ПЕРСИКИ '.repeat(10);
  document.getElementById('marquee-top').textContent = strip + strip;
  document.getElementById('marquee-bottom').textContent = strip + strip;

  document.getElementById('restart').addEventListener('click', reset);
  modePvpBtn.addEventListener('click', () => setMode(false));
  modeCpuBtn.addEventListener('click', () => setMode(true));

  renderScore();
  reset();
})();
</script>
</body>
</html>
